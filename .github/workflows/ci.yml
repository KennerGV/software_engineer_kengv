name: CI

on:
  push:
    branches:
      - main
      - feat/jules-ui-redesign
  pull_request:
    branches:
      - main
      - feat/jules-ui-redesign

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Validate production build
        run: npm run build
